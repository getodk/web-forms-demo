name: Web Forms Demo build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v6'
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell
      - run: npm run test
